# =============================================================================
# SEM Analysis Web App - Docker Compose Configuration
# Production-ready deployment configuration
# =============================================================================

version: '3.8'

services:
  sem-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sem-analysis-tool
    image: sem-analysis-tool:1.0.0
    restart: unless-stopped

    # ポートマッピング
    ports:
      - "3838:3838"

    # 環境変数
    environment:
      - SHINY_LOG_STDERR=1
      - TZ=Asia/Tokyo

    # リソース制限
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    # ボリューム
    volumes:
      - shiny-logs:/var/log/shiny-server
      - shiny-uploads:/tmp/shiny-uploads

    # ヘルスチェック
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # セキュリティ設定
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=512M

    # ネットワーク
    networks:
      - sem-network

# 名前付きボリューム
volumes:
  shiny-logs:
    driver: local
  shiny-uploads:
    driver: local

# ネットワーク
networks:
  sem-network:
    driver: bridge
